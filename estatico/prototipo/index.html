<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Grid Automóveis — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Showroom escuro: vitrine com a foto do carro flutuando sobre a ficha; página do carro com fotos e ficha lado a lado no computador. Amarelo Grid só no que é para tocar. */
:root{
  --bg:#121214; --sup:#1b1b1f; --sup2:#232328; --linha:#2f2f35; --ink:#f3f2ed; --ink2:#bab8b0; --ink3:#86847c;
  --amarelo:#f2c200; --amarelo-ink:#121214;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --corpo:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --dado:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --raio:6px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:3px 3px}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amarelo);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
.aviso-proto{background:#000;color:#cfcdc6;font-size:12.5px;text-align:center;padding:6px 16px}
.aviso-proto a{color:#fff}

header.topo{position:sticky;top:0;z-index:25;background:rgba(18,18,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{height:40px;width:auto;cursor:pointer}
.zap{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amarelo);color:var(--amarelo-ink);text-decoration:none;font-weight:800;padding:10px 16px;border-radius:var(--raio);font-size:15px;white-space:nowrap;border:0;cursor:pointer;transition:filter .2s}
.zap:hover{filter:brightness(1.08)}
.zap svg{width:18px;height:18px}
.flag{height:6px;background-image:linear-gradient(45deg,var(--ink) 25%,transparent 25%,transparent 75%,var(--ink) 75%),linear-gradient(45deg,var(--ink) 25%,var(--bg) 25%,var(--bg) 75%,var(--ink) 75%);background-size:6px 6px;background-position:0 0,3px 3px;opacity:.85}

.h1{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:72%;line-height:.95;letter-spacing:-.005em;margin:0;text-wrap:balance}
.intro{padding-block:30px 6px;display:grid;gap:10px}
.intro .h1{font-size:clamp(38px,7.5vw,68px);text-transform:uppercase}
.intro p{margin:0;color:var(--ink2);max-width:52ch}

.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:16px 26px}
.chip{background:transparent;border:1px solid var(--linha);color:var(--ink2);border-radius:var(--raio);padding:7px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo);color:var(--amarelo-ink);font-weight:700}
.ordem{margin-left:auto;background:var(--sup);color:var(--ink);border:1px solid var(--linha);border-radius:var(--raio);padding:7px 10px;font:inherit;font-size:14px}

/* vitrine: a foto flutua, solta da ficha */
.vitrine{display:grid;gap:44px 26px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));padding-bottom:56px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;position:relative}
.card .foto{position:relative;z-index:2;margin-inline:14px;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sup2);
  box-shadow:0 18px 36px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card .foto img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card .ficha{margin-top:-46px;padding:60px 18px 18px;background:linear-gradient(180deg,var(--sup2),var(--sup));border:1px solid var(--linha);border-radius:12px;display:grid;gap:8px;position:relative}
.card .ficha::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,var(--amarelo),transparent 70%);opacity:.0;transition:opacity .35s}
.card:hover .foto,.card:focus-visible .foto{transform:translateY(-8px) rotate(-.4deg);box-shadow:0 30px 50px -14px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.1)}
.card:hover .foto img{transform:scale(1.04)}
.card:hover .ficha::before{opacity:1}
.nome{font-family:var(--display);font-style:italic;font-weight:850;font-stretch:75%;font-size:25px;line-height:1.02}
.linha-dados{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--dado);font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.02em}
.preco{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.preco .de{color:var(--ink3);text-decoration:line-through;font-size:14px;font-variant-numeric:tabular-nums}
.preco .por{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:80%;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mini-dest{display:flex;gap:6px;flex-wrap:wrap}
.mini-dest span{font-size:12px;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--linha);border-radius:4px;padding:2px 8px}
.selo{display:inline-flex;align-items:center;gap:7px;background:rgba(12,12,14,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:5px 10px 5px 14px;font-size:12.5px;line-height:1;position:relative;overflow:hidden;white-space:nowrap}
.selo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,#111 25%,#111 75%,#fff 75%);background-size:6px 6px;background-position:0 0,3px 3px}
.selo svg{width:12px;height:12px;stroke:var(--amarelo);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.selo .t{text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:11px;color:#d9d7cf}
.selo .v{font-family:var(--dado);font-weight:500;font-variant-numeric:tabular-nums}
.foto .selo{position:absolute;top:10px;left:10px;z-index:2}
.vazio{padding:28px;border:1px dashed var(--linha);border-radius:12px;display:grid;gap:10px;justify-items:start;margin-bottom:48px}
.vazio .h1{font-size:32px}

/* página do carro */
.carro{padding-bottom:120px}
.voltar{background:none;border:0;color:var(--ink2);cursor:pointer;padding:16px 0;font-size:14px}
.layout-carro{display:grid;gap:26px;grid-template-columns:minmax(0,1fr);grid-template-areas:"gal" "lado" "loja"}
.layout-carro>*{min-width:0}
.gal{grid-area:gal;min-width:0}.lado{grid-area:lado;display:grid;gap:22px;align-content:start}.loja{grid-area:loja}
.trilho img{min-width:0}
.zap-ficha{display:none}
.galeria{position:relative;background:var(--sup2);border-radius:10px;overflow:hidden;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;cursor:zoom-in}
.contador{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:4px;font-variant-numeric:tabular-nums;font-family:var(--dado)}
.ampliar{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:12.5px;padding:4px 10px;border-radius:4px;cursor:pointer}
.seta{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.seta.ant{left:10px}.seta.prox{right:10px}
.miniaturas{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.miniaturas button{flex:0 0 78px;border:2px solid transparent;border-radius:6px;overflow:hidden;padding:0;background:var(--sup2);cursor:pointer;opacity:.6}
.miniaturas button[aria-current="true"]{border-color:var(--amarelo);opacity:1}
.miniaturas img{aspect-ratio:4/3;object-fit:cover;width:100%}
.cab{display:grid;gap:10px}
.cab .h1{font-size:clamp(34px,5vw,50px)}
.cab .preco .por{font-size:clamp(36px,5vw,48px)}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:10px;overflow:hidden;margin:0}
.specs div{background:var(--sup);padding:11px 14px;display:grid;gap:2px}
.specs dt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.specs dd{margin:0;font-weight:600;font-family:var(--dado);font-variant-numeric:tabular-nums}
.bloco{display:grid;gap:12px}
.bloco h2{font-family:var(--display);font-style:italic;font-weight:850;font-stretch:75%;font-size:24px;margin:0}
.destaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dest{background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start}
.dest svg{width:26px;height:26px;stroke:var(--amarelo);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dest span{font-size:14px;font-weight:600;line-height:1.25}
.proc{display:grid;gap:10px;background:var(--sup);border:1px solid var(--linha);border-radius:10px;padding:14px 16px}
.proc ul{margin:0;padding:0;display:grid;gap:8px}
.proc li{list-style:none;display:flex;gap:10px;align-items:center}
.ok{width:20px;height:20px;border-radius:50%;background:var(--amarelo);color:var(--amarelo-ink);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.conferido{font-size:13px;color:var(--ink3)}
details{background:var(--sup);border:1px solid var(--linha);border-radius:10px}
details+details{margin-top:8px}
summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
summary span{color:var(--ink3);font-weight:400;font-family:var(--dado);font-size:13px}
details ul{margin:0;padding:0 16px 14px 34px;columns:2 170px;color:var(--ink2);font-size:15px}
.msg{font-size:12.5px;color:var(--ink3);font-family:var(--dado);border:1px dashed var(--linha);padding:9px 11px;border-radius:8px}
/* a loja, embaixo das fotos */
.loja{display:grid;gap:12px;margin-top:6px}
.loja-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.loja-grade{grid-template-columns:minmax(0,1fr)}}
.loja-item{border:1px solid var(--linha);border-radius:10px;padding:14px;display:grid;gap:4px;background:rgba(255,255,255,.02)}
.loja-item b{font-family:var(--display);font-style:italic;font-weight:850;font-stretch:80%;font-size:18px}
.loja-item span{color:var(--ink2);font-size:14px}
.endereco{color:var(--ink2);font-size:14px}
.endereco b{color:var(--ink)}
.rodape-zap{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,18,20,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.rodape-zap .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-inline:0}
.rodape-zap .zap{flex:1;max-width:420px;padding:14px}
.rodape-zap .p{font-family:var(--display);font-style:italic;font-weight:900;font-stretch:80%;font-size:25px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (min-width:920px){
  .layout-carro{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"gal lado" "loja lado";grid-template-rows:auto 1fr;align-items:start}
  .loja{align-self:start}
  .lado{position:sticky;top:76px}
  .zap-ficha{display:inline-flex}
  .rodape-zap{display:none}
}
/* tela cheia */
.tela{position:fixed;inset:0;z-index:50;background:#000;display:grid;grid-template-rows:auto 1fr auto}
.tela .barra{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;color:#fff;font-family:var(--dado);font-size:13px}
.tela .fechar{background:#222;border:0;color:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
.tela .trilho{height:100%}
.tela .trilho img{aspect-ratio:auto;height:100%;object-fit:contain;cursor:default}
.tela .rodape{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
footer.rodape-site{border-top:1px solid var(--linha);color:var(--ink3);font-size:13px}
footer.rodape-site .wrap{padding-block:22px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(function(){
const CARROS=JSON.parse(document.getElementById('dados').textContent);
const ZAP='5531996011999';
const app=document.getElementById('app'),tela=document.getElementById('tela');
const brl=n=>'R$ '+n.toLocaleString('pt-BR');
const km=n=>n.toLocaleString('pt-BR')+' km';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frase=s=>{const t=s.toLowerCase();return (t.charAt(0).toUpperCase()+t.slice(1)).replace(/\bled\b/i,'LED').replace(/\bipva\b/i,'IPVA')};
const preco=c=>c.promo&&c.promo<c.preco?c.promo:c.preco;
const ICONES={
 couro:'<path d="M7 20v-5h10v5M8 15V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v9"/><path d="M10 8h4"/>',
 camera:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
 velocidade:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1"/>',
 celular:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>',
 sensor:'<path d="M5 8a10 10 0 0 1 0 8M9 10a5 5 0 0 1 0 4"/><rect x="13" y="6" width="7" height="12" rx="1.5"/>',
 portamalas:'<path d="M4 16V9l3-4h10l3 4v7z"/><path d="M4 12h16M9 16v3M15 16v3"/>',
 roda:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3.5v6M12 14.5v6M3.5 12h6M14.5 12h6"/>',
 teto:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 farol:'<path d="M14 6a6 6 0 0 1 0 12h-2V6z"/><path d="M3 8h6M3 12h6M3 16h6"/>',
 padrao:'<path d="M5 12.5l4.5 4.5L19 7"/>'
};
function icone(nome){const n=nome.toLowerCase();
  const k=n.includes('couro')?'couro':n.includes('câmera')?'camera':(n.includes('velocidade')||n.includes('piloto'))?'velocidade':n.includes('espelhamento')?'celular':n.includes('sensor')?'sensor':n.includes('porta malas')?'portamalas':n.includes('roda')?'roda':n.includes('teto')?'teto':(n.includes('farol')||n.includes('led'))?'farol':'padrao';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONES[k]+'</svg>'}
function linkZap(c){const t=c?`Olá! Vi o ${c.titulo} ${c.ano.split('/')[1]} (${brl(preco(c))}) no site da Grid. [ref ${c.id} · via site]`:'Olá! Vim pelo site da Grid.';
  return 'https://wa.me/'+ZAP+'?text='+encodeURIComponent(t)}
let estado={faixa:'todos',ordem:'recentes'};
const FAIXAS=[['todos','Todos'],['ate80','Até R$ 80 mil'],['80a120','R$ 80 a 120 mil'],['mais120','Acima de R$ 120 mil']];
function filtra(){let l=CARROS.filter(c=>{const p=preco(c);return estado.faixa==='todos'||(estado.faixa==='ate80'&&p<=80000)||(estado.faixa==='80a120'&&p>80000&&p<=120000)||(estado.faixa==='mais120'&&p>120000)});
  if(estado.ordem==='menor')l=l.slice().sort((a,b)=>preco(a)-preco(b));if(estado.ordem==='maior')l=l.slice().sort((a,b)=>preco(b)-preco(a));return l}
function selo(c){if(!(c.promo&&c.promo<c.preco))return '';return `<span class="selo"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v8M2.5 6.5 6 10l3.5-3.5"/></svg><span class="t">Baixou</span><span class="v">${brl(c.preco-c.promo)}</span></span>`}
function precoHtml(c){return '<div class="preco">'+(c.promo&&c.promo<c.preco?'<span class="de">'+brl(c.preco)+'</span>':'')+'<span class="por">'+brl(preco(c))+'</span></div>'}
function vitrine(){document.getElementById('zap-topo').href=linkZap(null);
  const l=filtra();
  app.innerHTML=`<section class="intro"><h1 class="h1">Seminovos selecionados em BH</h1><p>Fotos de verdade, ficha completa e o preço na tela. Gostou de um? Chama a gente no WhatsApp.</p></section>
  <div class="filtros" role="group" aria-label="Faixa de preço">${FAIXAS.map(([k,n])=>`<button type="button" class="chip" data-faixa="${k}" aria-pressed="${estado.faixa===k}">${n}</button>`).join('')}
  <select id="ordem" class="ordem" aria-label="Ordenar"><option value="recentes">Mais recentes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div>
  ${l.length?`<div class="vitrine">${l.map(c=>`<button type="button" class="card" data-id="${c.id}">
    <div class="foto">${selo(c)}<img loading="lazy" src="${c.fotos[0]}" alt="${esc(c.titulo)}"></div>
    <div class="ficha"><div class="nome">${esc(c.titulo)}</div><div class="linha-dados"><span>${c.ano}</span><span>${km(c.km)}</span><span>${esc(c.cambio)}</span></div>${precoHtml(c)}
    <div class="mini-dest">${c.dest.slice(0,3).map(d=>'<span>'+esc(frase(d))+'</span>').join('')}</div></div></button>`).join('')}</div>`
  :`<div class="vazio"><div class="h1">Não temos agora.</div><p>Diga o que você procura e avisamos quando chegar.</p><a class="zap" target="_blank" rel="noopener" href="${linkZap(null)}">Me avise quando chegar</a></div>`}`;
  document.getElementById('ordem').value=estado.ordem;
  app.querySelectorAll('[data-faixa]').forEach(b=>b.onclick=()=>{estado.faixa=b.dataset.faixa;vitrine()});
  document.getElementById('ordem').onchange=e=>{estado.ordem=e.target.value;vitrine()};
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{location.hash='c'+b.dataset.id});
}
function abrirTela(c,i){
  tela.innerHTML=`<div class="barra"><span id="tcont">${i+1} / ${c.fotos.length}</span><button type="button" class="fechar" id="tfechar">Fechar ✕</button></div>
  <div class="trilho" id="ttrilho">${c.fotos.map(f=>`<img src="${f}" alt="${esc(c.titulo)}">`).join('')}</div>
  <div class="rodape"><a class="zap" target="_blank" rel="noopener" href="${linkZap(c)}">Chamar no WhatsApp</a></div>`;
  tela.hidden=false;document.body.style.overflow='hidden';
  const tr=document.getElementById('ttrilho');tr.scrollLeft=i*tr.clientWidth;
  tr.addEventListener('scroll',()=>{document.getElementById('tcont').textContent=(Math.round(tr.scrollLeft/tr.clientWidth)+1)+' / '+c.fotos.length},{passive:true});
  const fechar=()=>{tela.hidden=true;tela.innerHTML='';document.body.style.overflow=''};
  document.getElementById('tfechar').onclick=fechar;
  document.onkeydown=e=>{if(tela.hidden)return;if(e.key==='Escape')fechar();if(e.key==='ArrowRight')tr.scrollBy({left:tr.clientWidth});if(e.key==='ArrowLeft')tr.scrollBy({left:-tr.clientWidth})};
  document.getElementById('tfechar').focus();
}
function carro(c){document.getElementById('zap-topo').href=linkZap(c);
  const grupos=Object.entries(c.grupos).filter(([,l])=>l.length);
  app.innerHTML=`<div class="carro"><button type="button" class="voltar" id="voltar">‹ Ver todos os carros</button>
  <div class="layout-carro">
    <div class="gal">
     <div class="galeria"><div class="trilho" id="trilho">${c.fotos.map((f,i)=>`<img ${i?'loading="lazy"':''} src="${f}" alt="${esc(c.titulo)}, foto ${i+1}" data-i="${i}">`).join('')}</div>
      <button type="button" class="seta ant" aria-label="Foto anterior">‹</button><button type="button" class="seta prox" aria-label="Próxima foto">›</button>
      <button type="button" class="ampliar" id="ampliar">⤢ Tela cheia</button>
      <div class="contador" id="cont">1 / ${c.fotos.length}</div></div>
     <div class="miniaturas" id="minis">${c.fotos.map((f,i)=>`<button type="button" data-i="${i}" aria-label="Foto ${i+1}" aria-current="${i===0}"><img loading="lazy" src="${f}" alt=""></button>`).join('')}</div>
    </div>
    <section class="loja" aria-label="Comprar na Grid">
      <h2 class="h1" style="font-size:26px">Comprar na Grid</h2>
      <div class="loja-grade">
        <div class="loja-item"><b>Fotos do próprio carro</b><span>Todas as fotos são feitas aqui na loja, do carro que você vai ver.</span></div>
        <div class="loja-item"><b>Seu carro na troca</b><span>Avaliamos o seu usado como parte do pagamento.</span></div>
        <div class="loja-item"><b>Financiamento</b><span>Fazemos a simulação com os bancos com que trabalhamos.</span></div>
        <div class="loja-item"><b>Transferência pela loja</b><span>Cuidamos da documentação para você sair dirigindo tranquilo.</span></div>
      </div>
      <div class="endereco"><b>Venha ver de perto:</b> Av. Dom Pedro II, 1900 · Carlos Prates · Belo Horizonte</div>
    </section>
   <div class="lado">
    <div class="cab"><h1 class="h1">${esc(c.titulo)}</h1>${precoHtml(c)}${selo(c)?'<div>'+selo(c)+'</div>':''}</div>
    <dl class="specs"><div><dt>Ano</dt><dd>${c.ano}</dd></div><div><dt>Quilometragem</dt><dd>${km(c.km)}</dd></div><div><dt>Câmbio</dt><dd>${esc(c.cambio)}</dd></div><div><dt>Combustível</dt><dd>${esc(c.comb)}</dd></div><div><dt>Cor</dt><dd>${esc(c.cor)}</dd></div><div><dt>Motor</dt><dd>${esc(c.motor||'—')}</dd></div></dl>
    <a class="zap zap-ficha" style="padding:15px" target="_blank" rel="noopener" href="${linkZap(c)}">Chamar no WhatsApp</a>
    ${c.dest.length?`<section class="bloco"><h2>Destaques</h2><div class="destaques">${c.dest.map(d=>`<div class="dest">${icone(d)}<span>${esc(frase(d))}</span></div>`).join('')}</div></section>`:''}
    ${c.proc.length?`<section class="bloco"><h2>Procedência</h2><div class="proc"><ul>${c.proc.map(p=>`<li><span class="ok" aria-hidden="true">✓</span>${esc(frase(p))}</li>`).join('')}</ul></div></section>`:''}
    <section class="bloco"><h2>Todos os itens</h2><div>${grupos.map(([g,l])=>`<details><summary>${g}<span>${l.length} itens</span></summary><ul>${l.map(i=>'<li>'+esc(frase(i))+'</li>').join('')}</ul></details>`).join('')}</div></section>
    <section class="bloco"><h2>A mensagem que chega no WhatsApp</h2><div class="msg">Olá! Vi o ${esc(c.titulo)} ${c.ano.split('/')[1]} (${brl(preco(c))}) no site da Grid. [ref ${c.id} · via site]</div></section>
   </div>
  </div></div>
  <div class="rodape-zap"><div class="wrap"><span class="p">${brl(preco(c))}</span><a class="zap" target="_blank" rel="noopener" href="${linkZap(c)}">Chamar no WhatsApp</a></div></div>`;
  window.scrollTo(0,0);
  document.getElementById('voltar').onclick=()=>{location.hash=''};
  const tr=document.getElementById('trilho'),cont=document.getElementById('cont'),minis=document.querySelectorAll('#minis button');
  const atual=()=>Math.round(tr.scrollLeft/tr.clientWidth);
  const ir=i=>tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'});
  app.querySelector('.seta.ant').onclick=()=>ir(Math.max(0,atual()-1));app.querySelector('.seta.prox').onclick=()=>ir(Math.min(c.fotos.length-1,atual()+1));
  tr.addEventListener('scroll',()=>{const i=atual();cont.textContent=(i+1)+' / '+c.fotos.length;minis.forEach((b,k)=>b.setAttribute('aria-current',k===i))},{passive:true});
  minis.forEach(b=>b.onclick=()=>ir(+b.dataset.i));
  tr.querySelectorAll('img').forEach(im=>im.onclick=()=>abrirTela(c,+im.dataset.i));
  document.getElementById('ampliar').onclick=()=>abrirTela(c,atual());
}
function rota(){const m=location.hash.match(/^#c(\d+)$/);const c=m&&CARROS.find(x=>x.id===+m[1]);c?carro(c):vitrine()}
window.addEventListener('hashchange',rota);
document.getElementById('logo').onclick=()=>{location.hash=''};
rota();
})();
</script>
