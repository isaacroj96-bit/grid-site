name: Publicar site

# Roda a cada mudança na main (inclusive quando o Integrador grava dados/estoque.json)
# e pode ser disparado à mão na aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: é dele que saem as páginas de "vendido"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar o site
        run: node build.js
        env:
          PIXEL_ID: ${{ vars.PIXEL_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
