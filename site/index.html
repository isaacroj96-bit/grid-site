<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grid Automóveis</title>
<style>
  :root{--bg:#141416;--ink:#f1f0ec;--sub:#a9a7a0;--accent:#f2c200}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;box-sizing:border-box;gap:14px}
  h1{font-style:italic;font-weight:800;font-size:clamp(40px,10vw,72px);letter-spacing:1px;margin:0}
  p{color:var(--sub);margin:0;max-width:34ch;line-height:1.5}
  a.btn{display:inline-block;margin-top:10px;background:var(--accent);color:#141416;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px}
  a.alt{color:var(--sub);font-size:14px}
  .flag{position:fixed;left:0;right:0;bottom:0;height:8px;background-image:linear-gradient(45deg,var(--ink) 25%,transparent 25%,transparent 75%,var(--ink) 75%),linear-gradient(45deg,var(--ink) 25%,var(--bg) 25%,var(--bg) 75%,var(--ink) 75%);background-size:8px 8px;background-position:0 0,4px 4px;opacity:.85}
</style>
</head>
<body>
<main>
  <h1>GRID</h1>
  <p>Nosso site novo está chegando. Enquanto isso, fale com a gente ou veja o estoque atual.</p>
  <a class="btn" href="https://wa.me/5531996011999">Chamar no WhatsApp</a>
  <a class="alt" href="https://gridbh.com.br">Ver os carros em gridbh.com.br</a>
</main>
<div class="flag" aria-hidden="true"></div>
</body>
</html>
