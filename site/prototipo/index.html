<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Grid Automóveis — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,800&family=Barlow:wght@400;500;600&family=Archivo:ital,wdth,wght@0,100,400;0,100,600;1,75,800;1,75,900&family=Saira+Condensed:ital,wght@1,700;1,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Três direções sobre a mesma base: A Garagem (grafite fosco, cards), B Showroom (claro, ficha ao lado da foto), C Pista (lista técnica, foto grande). Amarelo Grid só no que é para tocar. */
:root{
  --amarelo:#f2c200; --amarelo-ink:#141416;
  --bg:#141417; --sup:#1d1d21; --sup2:#26262b; --linha:#33333a; --ink:#f2f1ec; --ink2:#bdbbb3; --ink3:#8a8880;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --corpo:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --dado:"Barlow",system-ui,sans-serif;
  --raio:10px; color-scheme:dark;
}
body[data-v="b"]{
  --bg:#ecebe6; --sup:#ffffff; --sup2:#f4f3ef; --linha:#d9d7cf; --ink:#18181b; --ink2:#4a4944; --ink3:#78766f;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --corpo:"Archivo",system-ui,sans-serif; --dado:"Archivo",system-ui,sans-serif;
  --raio:4px; color-scheme:light;
}
body[data-v="c"]{
  --bg:#0f0f11; --sup:#17171a; --sup2:#202024; --linha:#2c2c31; --ink:#f4f3ee; --ink2:#b7b5ad; --ink3:#7f7d76;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif; --corpo:"IBM Plex Sans",system-ui,sans-serif; --dado:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --raio:0px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[data-v="a"]{background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* barra do protótipo */
.proto{position:sticky;top:0;z-index:30;background:#000;color:#fff;font:500 13px/1.3 system-ui,sans-serif;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.proto b{font-weight:600;opacity:.7}
.proto button{background:#2a2a2e;border:0;color:#ddd;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.proto button[aria-pressed="true"]{background:var(--amarelo);color:#111;font-weight:700}

/* topo */
header.topo{border-bottom:1px solid var(--linha);background:var(--bg)}
header.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{height:42px;width:auto;cursor:pointer}
.zap{display:inline-flex;align-items:center;gap:8px;background:var(--amarelo);color:var(--amarelo-ink);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:999px;font-size:15px;white-space:nowrap;border:0;cursor:pointer}
body[data-v="b"] .zap{border-radius:4px}
body[data-v="c"] .zap{border-radius:0;font-family:var(--dado);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.zap svg{width:18px;height:18px}
.flag{height:8px;background-image:linear-gradient(45deg,var(--ink) 25%,transparent 25%,transparent 75%,var(--ink) 75%),linear-gradient(45deg,var(--ink) 25%,var(--bg) 25%,var(--bg) 75%,var(--ink) 75%);background-size:8px 8px;background-position:0 0,4px 4px;opacity:.9}

/* títulos */
.h1{font-family:var(--display);font-style:italic;font-weight:800;line-height:.95;letter-spacing:.01em;margin:0;text-wrap:balance}
body[data-v="b"] .h1{font-stretch:75%;font-weight:900;letter-spacing:-.01em}
.intro{padding-block:28px 8px;display:grid;gap:10px}
.intro .h1{font-size:clamp(34px,7vw,60px);text-transform:uppercase}
.intro p{margin:0;color:var(--ink2);max-width:52ch}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px 18px}
.chip{background:transparent;border:1px solid var(--linha);color:var(--ink2);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo);color:var(--amarelo-ink);font-weight:600}
body[data-v="b"] .chip{border-radius:4px}
body[data-v="c"] .chip{border-radius:0;font-family:var(--dado);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.ordem{margin-left:auto;background:var(--sup);color:var(--ink);border:1px solid var(--linha);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px}
body[data-v="b"] .ordem{border-radius:4px}
body[data-v="c"] .ordem{border-radius:0;font-family:var(--dado);font-size:12.5px}

/* vitrine */
.vitrine{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));padding-bottom:40px}
.card{background:var(--sup);border-radius:var(--raio);overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--linha);padding:0;display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-3px);border-color:var(--ink3)}
.foto{aspect-ratio:4/3;background:var(--sup2);position:relative;overflow:hidden;max-width:100%}
.foto img{width:100%;height:100%;object-fit:cover}
.card .info{padding:14px 16px 16px;display:grid;gap:6px}
.card .nome{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase}
body[data-v="b"] .card .nome{font-stretch:75%;font-weight:800;text-transform:none;font-size:22px}
.meta{color:var(--ink3);font-size:14px;font-family:var(--dado);font-variant-numeric:tabular-nums}
.preco{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.preco .de{color:var(--ink3);text-decoration:line-through;font-size:14px}
.preco .por{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
body[data-v="b"] .preco .por{font-stretch:75%;font-weight:900}
.mini-dest{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mini-dest span{font-size:12px;color:var(--ink2);border:1px solid var(--linha);border-radius:999px;padding:2px 8px}
body[data-v="c"] .mini-dest span{border-radius:0;font-family:var(--dado);font-size:11px;text-transform:uppercase}
.selo{position:absolute;top:10px;left:10px;background:var(--amarelo);color:var(--amarelo-ink);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}

/* C: lista técnica */
body[data-v="c"] .vitrine{grid-template-columns:1fr;gap:0;border-top:1px solid var(--linha)}
body[data-v="c"] .card{flex-direction:row;border:0;border-bottom:1px solid var(--linha);background:transparent}
body[data-v="c"] .card:hover{transform:none;background:var(--sup)}
body[data-v="c"] .card .foto{width:min(42%,420px);flex:none;aspect-ratio:16/10}
body[data-v="c"] .card .info{align-content:center;padding:16px 20px;min-width:0}
body[data-v="c"] .card .nome{font-size:clamp(24px,3.2vw,38px)}
body[data-v="c"] .meta{text-transform:uppercase;font-size:12.5px;letter-spacing:.04em}

/* B: cards com ficha */
body[data-v="b"] .card{box-shadow:0 1px 0 rgba(0,0,0,.04)}
body[data-v="b"] .vitrine{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.vazio{padding:28px;border:1px dashed var(--linha);border-radius:var(--raio);display:grid;gap:10px;justify-items:start;margin-bottom:40px}
.vazio .h1{font-size:30px}

/* página do carro */
.carro{padding-bottom:110px}
.voltar{background:none;border:0;color:var(--ink2);cursor:pointer;padding:16px 0;font-size:14px}
.galeria{position:relative;background:var(--sup2);border-radius:var(--raio);overflow:hidden}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start}
.contador{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.setas button{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:20px}
.setas .ant{left:10px}.setas .prox{right:10px}
.layout-carro{display:grid;gap:22px}
.cab{display:grid;gap:8px;padding-top:18px}
.cab .h1{font-size:clamp(32px,6vw,52px);text-transform:uppercase}
body[data-v="b"] .cab .h1{text-transform:none}
.cab .preco .por{font-size:clamp(34px,6vw,46px)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
.specs div{background:var(--sup);padding:10px 12px;display:grid;gap:2px}
.specs dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.specs dd{margin:0;font-weight:600;font-family:var(--dado);font-variant-numeric:tabular-nums}
.bloco{display:grid;gap:12px}
.bloco h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;margin:0;text-transform:uppercase}
body[data-v="b"] .bloco h2{font-stretch:75%;text-transform:none}
body[data-v="c"] .bloco h2{font-family:var(--dado);font-style:normal;font-weight:500;font-size:13px;letter-spacing:.1em;color:var(--ink3)}
.destaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dest{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:12px;display:grid;gap:8px;align-content:start}
.dest svg{width:26px;height:26px;stroke:var(--amarelo);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body[data-v="b"] .dest svg{stroke:var(--ink)}
.dest span{font-size:14px;font-weight:600;line-height:1.25}
.proc{display:grid;gap:8px;background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}
.proc li{list-style:none;display:flex;gap:10px;align-items:center}
.proc ul{margin:0;padding:0;display:grid;gap:8px}
.proc .ok{width:20px;height:20px;border-radius:50%;background:var(--amarelo);color:var(--amarelo-ink);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.conferido{font-size:13px;color:var(--ink3)}
details{background:var(--sup);border:1px solid var(--linha);border-radius:var(--raio)}
details+details{margin-top:8px}
summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
summary span{color:var(--ink3);font-weight:400;font-family:var(--dado)}
details ul{margin:0;padding:0 16px 14px 34px;columns:2 180px;color:var(--ink2);font-size:15px}
.loja{color:var(--ink2);font-size:15px}
.loja b{color:var(--ink)}
.rodape-zap{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.rodape-zap .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-inline:0}
.rodape-zap .zap{flex:1;justify-content:center;max-width:420px;padding:14px}
.rodape-zap .p{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;white-space:nowrap}
body[data-v="b"] .rodape-zap .p{font-stretch:75%}
.msg{font-size:12.5px;color:var(--ink3);font-family:var(--dado);border:1px dashed var(--linha);padding:8px 10px;border-radius:var(--raio)}

/* B: foto e ficha lado a lado no computador */
@media (min-width:900px){
  body[data-v="b"] .layout-carro{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  body[data-v="b"] .lado{position:sticky;top:60px}
  body[data-v="a"] .galeria,body[data-v="c"] .galeria{max-height:72vh}
  body[data-v="a"] .trilho img,body[data-v="c"] .trilho img{aspect-ratio:16/9}
}
/* C: título sobre a foto */
body[data-v="c"] .galeria{border-radius:0;margin-inline:-16px}
body[data-v="c"] .cab{border-left:4px solid var(--amarelo);padding-left:14px;margin-top:6px}
@media (max-width:620px){
  body[data-v="c"] .card{flex-direction:column}
  body[data-v="c"] .card .foto{width:100%}
}
footer.rodape{border-top:1px solid var(--linha);color:var(--ink3);font-size:13px}
footer.rodape .wrap{padding-block:20px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</div>

<script>
(function(){
const CARROS=JSON.parse(document.getElementById('dados').textContent);
const ZAP='5531996011999';
const app=document.getElementById('app');
const brl=n=>'R$ '+n.toLocaleString('pt-BR');
const km=n=>n.toLocaleString('pt-BR')+' km';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frase=s=>{const t=s.toLowerCase();return (t.charAt(0).toUpperCase()+t.slice(1)).replace(/\bled\b/i,'LED').replace(/\bipva\b/i,'IPVA')};
const preco=c=>c.promo&&c.promo<c.preco?c.promo:c.preco;
const ICONES={
 couro:'<path d="M7 20v-5h10v5M8 15V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v9"/><path d="M10 8h4"/>',
 camera:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
 velocidade:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1"/>',
 celular:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/>',
 sensor:'<path d="M5 8a10 10 0 0 1 0 8M9 10a5 5 0 0 1 0 4"/><rect x="13" y="6" width="7" height="12" rx="1.5"/>',
 portamalas:'<path d="M4 16V9l3-4h10l3 4v7z"/><path d="M4 12h16M9 16v3M15 16v3"/>',
 roda:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3.5v6M12 14.5v6M3.5 12h6M14.5 12h6"/>',
 teto:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 farol:'<path d="M14 6a6 6 0 0 1 0 12h-2V6z"/><path d="M3 8h6M3 12h6M3 16h6"/>',
 padrao:'<path d="M5 12.5l4.5 4.5L19 7"/>'
};
function icone(nome){const n=nome.toLowerCase();
  const k=n.includes('couro')?'couro':n.includes('câmera')?'camera':(n.includes('velocidade')||n.includes('piloto'))?'velocidade':n.includes('espelhamento')?'celular':n.includes('sensor')?'sensor':n.includes('porta malas')?'portamalas':n.includes('roda')?'roda':n.includes('teto')?'teto':(n.includes('farol')||n.includes('led'))?'farol':'padrao';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONES[k]+'</svg>'}
function linkZap(c){const t=c?`Olá! Vi o ${c.titulo} ${c.ano.split('/')[1]} (${brl(preco(c))}) no site da Grid. [ref ${c.id} · via site]`:'Olá! Vim pelo site da Grid.';
  return 'https://wa.me/'+ZAP+'?text='+encodeURIComponent(t)}
let estado={faixa:'todos',ordem:'recentes',carro:null};
const FAIXAS=[['todos','Todos'],['ate80','Até R$ 80 mil'],['80a120','R$ 80 a 120 mil'],['mais120','Acima de R$ 120 mil']];
function filtra(){let l=CARROS.filter(c=>{const p=preco(c);return estado.faixa==='todos'||(estado.faixa==='ate80'&&p<=80000)||(estado.faixa==='80a120'&&p>80000&&p<=120000)||(estado.faixa==='mais120'&&p>120000)});
  if(estado.ordem==='menor')l=l.slice().sort((a,b)=>preco(a)-preco(b));if(estado.ordem==='maior')l=l.slice().sort((a,b)=>preco(b)-preco(a));return l}
function precoHtml(c){return '<div class="preco">'+(c.promo&&c.promo<c.preco?'<span class="de">'+brl(c.preco)+'</span>':'')+'<span class="por">'+brl(preco(c))+'</span></div>'}
function vitrine(){document.getElementById('zap-topo').href=linkZap(null);
  const l=filtra();
  app.innerHTML=`<section class="intro"><h1 class="h1">Seminovos selecionados em BH</h1><p>Cada carro com fotos de verdade, opcionais conferidos e o preço na tela. Escolheu? Chama a gente no WhatsApp.</p></section>
  <div class="filtros" role="group" aria-label="Faixa de preço">${FAIXAS.map(([k,n])=>`<button type="button" class="chip" data-faixa="${k}" aria-pressed="${estado.faixa===k}">${n}</button>`).join('')}
  <label class="sr" for="ordem" hidden>Ordenar</label><select id="ordem" class="ordem" aria-label="Ordenar"><option value="recentes">Mais recentes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div>
  ${l.length?`<div class="vitrine">${l.map(c=>`<button type="button" class="card" data-id="${c.id}">
    <div class="foto">${c.promo&&c.promo<c.preco?'<span class="selo">Preço baixou</span>':''}<img loading="lazy" src="${c.fotos[0]}" alt="${esc(c.titulo)}"></div>
    <div class="info"><div class="nome">${esc(c.titulo)}</div><div class="meta">${c.ano} · ${km(c.km)} · ${esc(c.cambio)}</div>${precoHtml(c)}
    <div class="mini-dest">${c.dest.slice(0,3).map(d=>'<span>'+esc(frase(d))+'</span>').join('')}</div></div></button>`).join('')}</div>`
  :`<div class="vazio"><div class="h1">Não temos agora.</div><p>Diga o que você procura e avisamos quando chegar.</p><a class="zap" target="_blank" rel="noopener" href="${linkZap(null)}">Me avise quando chegar</a></div>`}`;
  document.getElementById('ordem').value=estado.ordem;
  app.querySelectorAll('[data-faixa]').forEach(b=>b.onclick=()=>{estado.faixa=b.dataset.faixa;vitrine()});
  document.getElementById('ordem').onchange=e=>{estado.ordem=e.target.value;vitrine()};
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>abrir(+b.dataset.id));
}
function abrir(id){location.hash='c'+id}
function carro(c){document.getElementById('zap-topo').href=linkZap(c);
  const grupos=Object.entries(c.grupos).filter(([,l])=>l.length);
  app.innerHTML=`<div class="carro"><button type="button" class="voltar" id="voltar">‹ Ver todos os carros</button>
  <div class="layout-carro"><div>
    <div class="galeria"><div class="trilho" id="trilho">${c.fotos.map((f,i)=>`<img ${i?'loading="lazy"':''} src="${f}" alt="${esc(c.titulo)}, foto ${i+1}">`).join('')}</div>
    <div class="setas"><button type="button" class="ant" aria-label="Foto anterior">‹</button><button type="button" class="prox" aria-label="Próxima foto">›</button></div>
    <div class="contador" id="cont">1 / ${c.fotos.length}</div></div>
  </div>
  <div class="lado" style="display:grid;gap:22px">
    <div class="cab"><h1 class="h1">${esc(c.titulo)}</h1>${precoHtml(c)}</div>
    <dl class="specs" style="margin:0"><div><dt>Ano</dt><dd>${c.ano}</dd></div><div><dt>Quilometragem</dt><dd>${km(c.km)}</dd></div><div><dt>Câmbio</dt><dd>${esc(c.cambio)}</dd></div><div><dt>Combustível</dt><dd>${esc(c.comb)}</dd></div><div><dt>Cor</dt><dd>${esc(c.cor)}</dd></div>${c.motor?`<div><dt>Motor</dt><dd>${esc(c.motor)}</dd></div>`:''}</dl>
    ${c.dest.length?`<section class="bloco"><h2>Destaques</h2><div class="destaques">${c.dest.map(d=>`<div class="dest">${icone(d)}<span>${esc(frase(d))}</span></div>`).join('')}</div></section>`:''}
    ${c.proc.length?`<section class="bloco"><h2>Procedência</h2><div class="proc"><ul>${c.proc.map(p=>`<li><span class="ok" aria-hidden="true">✓</span>${esc(frase(p))}</li>`).join('')}</ul><div class="conferido">Opcionais conferidos pela Grid</div></div></section>`:''}
    <section class="bloco"><h2>Todos os itens</h2><div>${grupos.map(([g,l])=>`<details><summary>${g}<span>${l.length} itens</span></summary><ul>${l.map(i=>'<li>'+esc(frase(i))+'</li>').join('')}</ul></details>`).join('')}</div></section>
    <section class="bloco"><h2>A mensagem que chega no WhatsApp</h2><div class="msg">Olá! Vi o ${esc(c.titulo)} ${c.ano.split('/')[1]} (${brl(preco(c))}) no site da Grid. [ref ${c.id} · via site]</div></section>
    <section class="bloco loja"><h2>Onde ver</h2><div><b>Grid Automóveis</b><br>Av. Dom Pedro II, 1900 · Carlos Prates · Belo Horizonte</div></section>
  </div></div></div>
  <div class="rodape-zap"><div class="wrap"><span class="p">${brl(preco(c))}</span><a class="zap" target="_blank" rel="noopener" href="${linkZap(c)}">Chamar no WhatsApp</a></div></div>`;
  window.scrollTo(0,0);
  document.getElementById('voltar').onclick=()=>{history.length>1?history.back():(location.hash='')};
  const tr=document.getElementById('trilho'),cont=document.getElementById('cont');
  const passo=d=>tr.scrollBy({left:d*tr.clientWidth,behavior:'smooth'});
  app.querySelector('.ant').onclick=()=>passo(-1);app.querySelector('.prox').onclick=()=>passo(1);
  tr.addEventListener('scroll',()=>{cont.textContent=(Math.round(tr.scrollLeft/tr.clientWidth)+1)+' / '+c.fotos.length},{passive:true});
}
function rota(){const m=location.hash.match(/^#c(\d+)$/);const c=m&&CARROS.find(x=>x.id===+m[1]);c?carro(c):vitrine()}
window.addEventListener('hashchange',rota);
document.getElementById('logo').onclick=()=>{location.hash=''};
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{document.body.dataset.v=b.dataset.set;document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',x===b));try{localStorage.setItem('proto-v',b.dataset.set)}catch(e){}});
try{const v=localStorage.getItem('proto-v');if(v){const b=document.querySelector('[data-set="'+v+'"]');b&&b.click()}}catch(e){}
rota();
})();
</script>
</body>
</html>
